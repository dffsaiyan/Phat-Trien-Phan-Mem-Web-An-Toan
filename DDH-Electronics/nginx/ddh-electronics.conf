# =====================================================================
# CẤU HÌNH VIRTUAL HOST NGINX & HTTPS CHO DDH-ELECTRONICS
# =====================================================================

# 1. Chuyển hướng tự động toàn bộ lưu lượng HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name ddh-electronics.epu.vn www.ddh-electronics.epu.vn localhost;

    # 301 Permanent Redirect: Ép trình duyệt luôn chuyển sang HTTPS an toàn
    return 301 https://$host$request_uri;
}

# 2. Cấu hình Virtual Host bảo mật với HTTPS & SSL/TLS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ddh-electronics.epu.vn www.ddh-electronics.epu.vn localhost;

    root /var/www/ddh-electronics/public;
    index index.php index.html index.htm;

    # --- CHỨNG CHỈ SỐ SSL / TLS (Let's Encrypt hoặc Tự ký) ---
    ssl_certificate /etc/letsencrypt/live/ddh-electronics.epu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddh-electronics.epu.vn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ddh-electronics.epu.vn/chain.pem;

    # --- GIAO THỨC BẢO MẬT: CHỈ DÙNG TLS 1.2 & TLS 1.3 (Tắt SSLv3, TLS 1.0, 1.1) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Tối ưu hóa phiên làm việc SSL Session Cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Tăng tốc độ xác thực chứng chỉ từ CA)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --- CÁC TIÊU ĐỀ BẢO MẬT TẦNG WEB SERVER (DEFENSE IN DEPTH) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- KHÓA CẤM TRUY CẬP CÁC TỆP TIN NHẠY CẢM (.env, .git, v.v.) ---
    location ~ /\.(env|git|htaccess|svn) {
        deny all;
        return 404;
    }

    # --- XỬ LÝ ĐIỀU HƯỚNG REQUEST LARAVEL ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- CHUYỂN TIẾP XỬ LÝ PHP-FPM HOẶC BACKEND DEV SERVER ---
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Tắt log đối với các file tĩnh và favicon để giảm tải server
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Giới hạn dung lượng tải tệp lên (Chống DoS Upload)
    client_max_body_size 10M;
}
